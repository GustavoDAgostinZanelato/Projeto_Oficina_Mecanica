# Blueprint do Render — 4 microsserviços (Docker) no plano gratuito.
# Uso: Dashboard > New > Blueprint > selecionar este repositório.
#
# Atenção: no plano free o disco é efêmero. O SQLite (/data) é recriado
# a cada deploy/restart e os serviços "dormem" após ~15 min sem tráfego
# (a primeira requisição pode levar ~50 s).

services:
  - type: web
    name: clientes
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./Clientes
    dockerfilePath: ./Clientes/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: veiculos
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./Veiculos
    dockerfilePath: ./Veiculos/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: pecas
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./Pecas
    dockerfilePath: ./Pecas/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: ordemservico
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./OrdemServico
    dockerfilePath: ./OrdemServico/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # URLs públicas reais dos outros serviços (o Render acrescenta sufixo
      # ao nome quando ele já está em uso).
      - key: Microservices__ClientesUrl
        value: https://clientes-aj8n.onrender.com
      - key: Microservices__VeiculosUrl
        value: https://veiculos-qebj.onrender.com
      - key: Microservices__PecasUrl
        value: https://pecas.onrender.com
